<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cart — Daily Cart</title>
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/">Daily<span>Cart</span></a>
    <nav class="nav-links">
      <a href="/shop">Shop</a>
      <a href="/shop?category=cricket">Cricket</a>
      <a href="/shop?category=football">Football</a>
      <a href="/shop?category=badminton">Badminton</a>
      <a href="/shop?category=fitness">Fitness</a>
    </nav>
    <div class="search-box">
      <form action="/shop" method="GET"><input type="text" name="q" placeholder="Search cricket bat, football..." /></form>
    </div>
    <a class="cart-link" href="/cart">Cart <span class="badge-count" id="cart-count">0</span></a>
  </div>
</header>

<section class="section wrap">
  <div class="section-head"><h2>Your Cart</h2></div>
  <div id="cart-content"></div>
</section>

<footer class="site-footer">
  <div class="wrap"><strong>Daily Cart</strong> — Sports gear, delivered across Nepal.</div>
</footer>

<script src="/static/js/app.js"></script>
<script>
  const DELIVERY_FEE = 100;

  function render() {
    const cart = DC.getCart();
    const content = document.getElementById("cart-content");

    if (cart.length === 0) {
      content.innerHTML = `
        <div class="empty-state">
          Your cart is empty.<br /><br />
          <a class="btn btn-primary" href="/shop">Continue Shopping</a>
        </div>`;
      return;
    }

    const subtotal = DC.cartSubtotal();
    const total = subtotal + DELIVERY_FEE;

    content.innerHTML = `
      <div class="shop-layout">
        <div style="grid-column:1">
          <table class="cart-table">
            <thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr></thead>
            <tbody>
              ${cart.map(i => `
                <tr>
                  <td><div class="cart-item-name"><span class="icon">${i.icon}</span> ${DC.escapeHtml(i.name)}</div></td>
                  <td>${DC.money(i.price)}</td>
                  <td>
                    <div class="qty-box" style="width:110px">
                      <button onclick="changeQty(${i.product_id}, ${i.qty - 1})">−</button>
                      <input type="text" value="${i.qty}" readonly />
                      <button onclick="changeQty(${i.product_id}, ${i.qty + 1})">+</button>
                    </div>
                  </td>
                  <td>${DC.money(i.price * i.qty)}</td>
                  <td><a class="remove-link" href="#" onclick="removeItem(${i.product_id});return false;">Remove</a></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
          <div style="margin-top:14px">
            <a class="btn btn-outline" href="/shop">Continue Shopping</a>
          </div>
        </div>
        <div class="summary-card" style="grid-column:2">
          <div class="summary-row"><span>Subtotal</span><span>${DC.money(subtotal)}</span></div>
          <div class="summary-row"><span>Delivery</span><span>${DC.money(DELIVERY_FEE)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${DC.money(total)}</span></div>
          <a class="btn btn-primary btn-block" style="margin-top:14px" href="/checkout">Proceed to Checkout</a>
        </div>
      </div>
    `;
  }

  function changeQty(productId, qty) {
    DC.setQty(productId, qty);
    render();
  }
  function removeItem(productId) {
    DC.removeFromCart(productId);
    render();
  }

  render();
</script>
</body>
</html>
